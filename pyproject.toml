[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ArtifiNet"
version = "0.50.2"
description = "A magic AI builder library"
requires-python = ">=3.9"
readme = "README.md"

license = "MIT"
authors = [ { name="AV10010101", email="amiralivahedpour@gmail.com" } ]
maintainers = [ { name="AV10010101", email="amiralivahedpour@gmail.com" } ]

dependencies = ["numpy", "safeserialize", "joblib"]

[project.urls]
Homepage      = "https://github.com/AmirAliV88/ArtifiNet"
Repository    = "https://github.com/AmirAliV88/ArtifiNet"
Issues        = "https://github.com/AmirAliV88/ArtifiNet/issues"
Changelog     = "https://github.com/AmirAliV88/ArtifiNet/releases"

[tool.setuptools]
package-dir = { ""="src" }
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
include = ["ArtifiNet*"]



