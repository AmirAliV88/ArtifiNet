[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ArtifiNet"
version = "0.1.0"
description = "A magic AI builder library"
requires-python = ">=3.9"
readme = "README.md"

license = "MIT"
authors = [ { name="AV10010101", email="amiralivahedpour@gmail.com" } ]
maintainers = [ { name="AV10010101", email="amiralivahedpour@gmail.com" } ]

dependencies = [  "numpy",  "re",  "collections",  "safeserialize",  "joblib",  "pickle"  ]

#!!!
[project.urls]
Homepage      = "https://github.com/USERNAME/My-Repo-lib"
Repository    = "https://github.com/USERNAME/My-Repo-lib"
Issues        = "https://github.com/USERNAME/My-Repo-lib/issues"
Changelog     = "https://github.com/USERNAME/My-Repo-lib/releases"

[tool.setuptools]
package-dir = { ""="src" }
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
include = ["ArtifiNet*"]
